name: Workshop installer smoke

on:
  pull_request:
    paths:
      - .github/workflows/workshop-installer-smoke.yml
      - crates/build-workshop/**
      - crates/workshop/desktop/installer.nsi
      - crates/workshop/desktop/tauri*.conf.json
      - crates/workshop/package.json
      - crates/workshop/package-lock.json
  workflow_dispatch:

jobs:
  compile-nsis:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The workshop install brings the pinned Tauri CLI; the release
      # Gateway's default `config-ui` feature needs the config UI's.
      - name: Install UI dependencies
        shell: bash
        run: |
          npm ci --prefix crates/workshop
          npm ci --prefix crates/gateway/config-ui/ui

      - name: Build the unsigned installer
        run: cargo workshop installer --target x86_64-pc-windows-msvc

      - name: The installer was collected
        shell: bash
        run: |
          shopt -s nullglob
          setups=(target/installer/x86_64-pc-windows-msvc/publish/PromptForge_*_x64-setup.exe)
          [ "${#setups[@]}" -eq 1 ] || { echo "expected one setup, found ${#setups[@]}"; ls -R target/installer; exit 1; }
          echo "built ${setups[0]}"

      - name: Clean tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the installer smoke dirtied the repository:"
            git status --porcelain
            exit 1
          fi
